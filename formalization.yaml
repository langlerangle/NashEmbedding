# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Nash's isometric embedding theorem for closed manifolds (Günther's proof)"
  description: >-
    A Lean 4 / Mathlib formalization of Nash's C^∞ isometric embedding
    theorem for closed manifolds: every compact smooth manifold without boundary,
    equipped with a smooth Riemannian metric, admits a smooth injective map into
    some Euclidean space ℝ^q whose differential pulls the Euclidean inner product
    back to the given metric. The proof formalized is Günther's (1989), which
    replaces the Nash-Moser iteration by an elliptic fixed-point argument,
    following the presentation in A. J. Wassermann's Cambridge Part III lecture
    notes as the primary source. The development has two layers. The first proves
    the theorem for the flat torus: a self-contained Sobolev toolkit on 𝕋ⁿ
    (weighted ℓ² Sobolev spaces on ℤⁿ, Rellich compactness, the Sobolev sup bound,
    three multiplication theorems, mollifiers, periodization, Fourier inversion and
    Parseval), the approximation of smooth metrics by realizable ones, Günther's
    perturbation theorem proved by a contraction in Hˢ, and their assembly into
    the statement that every smooth 2π-periodic positive-definite matrix field on
    ℝⁿ is the pullback metric of a smooth periodic immersion that is injective
    modulo 2πℤⁿ. The second layer reduces the closed-manifold case to the torus:
    a Whitney embedding from Mathlib is extended to the ambient space, the metric is
    extended by a pseudo-inverse construction, cut off, symmetrized and periodized,
    and the torus theorem is applied. No bound on the embedding dimension is
    claimed. Concrete instances (round spheres of every dimension, products of
    spheres, the flat torus 𝕊¹ × 𝕊¹) are derived, and the flat-torus instance is
    shown to reproduce the torus theorem's conclusion, tying the two layers
    together. Nothing here is claimed to be new.
  authors:
    - "David Wiygul"
  license: "Apache-2.0"
  responsible_maintainers:
    - "David Wiygul"

classification:
  arxiv: [math.DG, math.AP]
  msc2020: ["53C42", "53C21", "58J05", "46E35"]

status:
  scope: >-
    Complete for closed manifolds: every Hausdorff compact smooth manifold without
    boundary (Mathlib's [IsManifold I ∞ M] with a boundaryless model with corners,
    [T2Space M], [CompactSpace M]) and every smooth Riemannian metric in Mathlib's
    sense (ContMDiffRiemannianMetric I ∞ E (TangentSpace I)). Manifolds with
    boundary and non-compact manifolds are not treated. The embedding dimension q
    is existentially quantified and no bound on it is stated; the construction's
    dimension depends on the chosen bump covering and is far from optimal. The
    conclusion is a smooth injective map pulling the Euclidean inner product back
    to g. Two consequences are proved as separate corollaries and are not part of
    the compared statement: injectivity of the differential (from positive
    definiteness of g and the pullback identity), and closed embeddedness (from
    compactness). "Without boundary" is Mathlib's model-level I.Boundaryless (the
    model with corners has full range), which is stronger than the pointwise
    BoundarylessManifold I M; the latter is not assumed. Smoothness throughout is
    C^∞, Mathlib's ∞ (the inner top of WithTop ℕ∞); the outer top ω, analytic, is
    never used.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
  main_results:
    - declaration: "NashEmbeddingTheorem.nash_isometric_embedding"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []

fidelity:
  divergences: >-
    The compared statement is Nash's theorem for closed manifolds in its standard
    form for manifolds modelled on a boundaryless model with corners (I.Boundaryless),
    Hausdorff and compact, with no further restriction. The
    proof follows Günther's method as presented in Wassermann's notes; the notes
    are unpublished lecture notes, so no line-by-line correspondence is claimed,
    and several estimates were re-derived with different constants or stronger
    regularity indices where the formalization required it. The flat-torus layer
    is stated on ℝⁿ with 2πℤⁿ-periodic data rather than on a quotient
    manifold, which is what the reduction step consumes. The reduction from closed
    manifolds to the torus uses Mathlib's bump-covering embedding into a Euclidean
    space rather than a tubular-neighbourhood argument. Lemma names differ from
    the informal text throughout; the README records the correspondence of the
    main steps.

sources:
  - title: "The imbedding problem for Riemannian manifolds"
    authors: ["John Nash"]
    type: "paper"
    location: "Annals of Mathematics 63 (1956), 20-63"
    relationship: background
    note: >-
      The theorem. Nash's own proof (the Nash-Moser iteration) is not the one
      formalized.
  - title: "On the perturbation problem associated to isometric embeddings of Riemannian manifolds"
    authors: ["Matthias Günther"]
    type: "paper"
    location: "Annals of Global Analysis and Geometry 7 (1989), 69-77"
    relationship: adapts
    note: >-
      The proof strategy formalized: an elliptic reformulation of the perturbation
      problem that makes it a fixed-point problem in Sobolev spaces, avoiding the
      Nash-Moser scheme. Reached through Wassermann's presentation rather than
      transcribed from this paper.
  - title: "The Atiyah-Singer Index Theorem, Part III lecture notes (Cambridge, Lent 2010): Sobolev spaces on the torus, Nash's embedding theorem for the N-torus, the reduction of the compact case"
    authors: ["A. J. Wassermann"]
    type: "other"
    relationship: formalizes
    note: >-
      The primary source: unpublished lecture notes, which the author of this
      submission selected and which the formalization follows in its overall
      route (a self-contained Sobolev theory on the torus, Günther's perturbation
      theorem for the flat torus, and the reduction of the closed-manifold case).
      Because the notes are not published, the correspondence is recorded at the
      level of the main steps only; see fidelity.divergences.
  - title: "Günther's proof of Nash's isometric embedding theorem"
    authors: ["Deane Yang"]
    type: "other"
    id: "arXiv:math/9807169"
    relationship: background
    note: >-
      A freely available exposition of Günther's argument, cited for readers;
      not used in producing the formalization.

related_formalizations: []

automation:
  methods:
    - method: agent
      models: ["Claude Opus 4.7 (Anthropic)"]
      framework: "Claude Code"
      tool_setup: >-
        April-May 2026: initial planning with the human author, the informal
        blueprints of the torus layer (Sobolev toolkit and Theorem A), and the
        submission of those stages to Aristotle as formalization tasks; Aristotle wrote most of the Lean
        statements of those stages as well as the proofs.
    - method: agent
      models: ["Claude Fable 5 (Anthropic)", "Claude Opus 4.7 (Anthropic)"]
      framework: "Claude Code"
      tool_setup: >-
        August 2026: two persistent Claude Code sessions (Claude Fable 5 and
        Claude Opus 4.7) worked with the author but largely with each other.
        They designed the perturbation theorem and the closed-manifold
        reduction, wrote the principal Lean statements of every August file
        and the file architecture, wrote several files by hand (dual frames,
        the abstract fixed point, the bump construction, the assemblies),
        submitted successive formalization tasks to Aristotle, integrated its
        contributions, and separately double-checked every Aristotle contribution
        before integrating it (statements byte-identical, only the target file
        touched, no sorry/admit/exact?/native_decide, full build, standard
        axioms).
    - method: agent
      framework: "Aristotle (Harmonic), CLI 2.1.0, pinned to Lean v4.28.0 and Mathlib v4.28.0"
      models: []
      tool_setup: >-
        Lean formalization and proving system. In April-May 2026 it produced most
        of the Lean statements and proofs of the torus toolkit and Theorem A from
        Claude's informal blueprints (16 project submissions, in eight stages with
        retakes); in August 2026 it supplied most proof bodies, and some auxiliary
        lemma statements, within the architecture designed by the Claude sessions
        (21 submissions: the perturbation theorem, the assembly leaves, the
        closed-manifold reduction, the metric constructions and the examples), of
        which one was a duplicate submission whose result was not used; every
        August contribution that was used passed on first submission. Project
        identifiers are listed in PROVENANCE.md so that the record can be
        checked against Harmonic's logs.
      cost:
        tokens: "not exposed by the service"
    - method: agent
      models: ["Claude Fable 5 (Anthropic)", "Claude Opus 4.7 (Anthropic)"]
      framework: "Claude Code"
      tool_setup: >-
        September 2026: two Claude sessions ported the tree from Lean/Mathlib
        v4.28.0 to v4.31.0 (`fabf563a7c`). Among pre-existing declarations, the
        port preserves source-level theorem/definition types (verified by
        parsed-signature comparison across the port diff) except for the
        disclosed `SmoothBumpCovering.exists_extension` API adaptation (see
        PROVENANCE.md and
        `NashEmbedding/Compact/WhitneyExtension.lean`); no pre-existing
        NashEmbedding instance was renamed. Other changes are
        proof- and elaboration-compatibility edits (including four declaration-
        scoped `backward.isDefEq.respectTransparency` options in
        `NashEmbedding/Examples/FlatTorus.lean`, whose elaborated statements
        differ from the pre-port forms only within documented defeq classes),
        deprecation and API-name migrations, and the following recorded
        compatibility declarations: `SmoothBumpCovering.embPiTan` and two
        lemma wrappers around Mathlib's `embeddingPiTangent` API (non-public
        at v4.31.0 per Mathlib PR #39886); the `@[fun_prop]` helper
        `contDiff_matrix` in `NashEmbedding/Torus/RealizableMetrics.lean`; and
        one global `ChartedSpace` bridge instance in
        `NashEmbedding/Compact/Main.lean`. `NashEmbedding/Compact/WhitneyExtension.lean`
        was converted to a module and uses `import all` to reach Mathlib's
        private implementation. Verification: full serial build,
        `scripts/audit.sh` (canonical axiom footprint on all principal
        results), `scripts/verify.sh` (Comparator replay green), and a two-pin
        statement-fidelity capture confirming the compared statement
        byte-identical at pp.all across the pins.
  notes: >-
    project.authors lists the human project author, per the Palomar policy
    reserving that field for humans; material AI contributions are credited
    in automation.methods above and in the per-file provenance record
    ([PROVENANCE.md](PROVENANCE.md)). The Lean file headers separately list
    the systems that wrote Lean and identify David Wiygul as the requester
    and human design contributor; the initial commit message records the
    division of labor and credits Aristotle-Harmonic. The human author
    proposed the project, selected Wassermann's notes as the source, and
    took part in the early design decisions; the Lean development was
    produced by the AI systems above. The human author reviewed the design
    and the principal statements, but did not review the Lean proofs in
    detail. Essentially all Lean text
    was produced by AI systems: the architecture, the assembly and (from
    August 2026) the principal statements by Claude (Anthropic) sessions;
    the proofs, some auxiliary lemma statements, and in the first stages
    most of the statements as well, by Aristotle (Harmonic). The repository
    contains no project-defined axiom and no native_decide.
    Aristotle did not participate in the v4.31 port, the Palomar packaging,
    or the preparation of this submission (see the September 2026 entry in
    automation.methods above).

review:
  status: self-assessed
  reviewers:
    - "David Wiygul"
    - "GPT-5.6 Sol (OpenAI), statement, provenance and editorial audit"
  notes: >-
    No independent human review of the mathematics or of the Lean source.
    Every theorem is checked by Lean; scripts/audit.sh checks the trust
    conditions (no forbidden tokens, exactly one deliberate sorry in
    Challenge.lean, standard axioms for each principal result listed in
    scripts/axioms.lean); and each Aristotle contribution was separately
    verified by two Claude sessions before being merged. The compared
    statement in Challenge.lean was reviewed at the statement level by both
    sessions against the informal theorem. A prior GPT-5.6 Sol (OpenAI)
    audit of the earlier public v4.28.0 submission identified no
    statement-level defect in the versions it examined and led to a series
    of provenance/editorial corrections in that pre-port tree. This
    v4.31.0 candidate was separately reviewed by a fresh GPT-5.6 Sol
    instance — statement, metadata, provenance, Palomar-readiness and
    editorial review; not an independent proof review — and the findings
    from that round were addressed in the commits atop the audited port
    commit. None of this is a proof review or an independent validation of
    the informal argument; the statement-level portion of the external
    audit did assess the Challenge against the standard qualitative Nash
    theorem and the relevant Mathlib meanings.

alignment:
  namespace: "NashEmbedding"
  statements:
    - source: "Nash's isometric embedding theorem for closed C^∞ manifolds"
      lean: "NashEmbeddingTheorem.nash_isometric_embedding"
      module: "Challenge (statement), Solution (proof)"
      status: proved
      note: >-
        The statement of record, compared by Comparator; Solution.lean discharges
        it from NashEmbedding.nashCompact by unfolding the predicate
        PullsBackEuclidean and the identity wrapper toEuclid, both defined in
        NashEmbedding/Compact/Main.lean.
    - source: "Nash's theorem for the flat torus (Wassermann, Nash's embedding theorem for the N-torus)"
      lean: "NashEmbedding.nashTorus"
      module: "NashEmbedding.Torus.Main"
      status: proved
      note: >-
        Every smooth 2π-periodic positive-definite matrix field on ℝⁿ is the
        pullback metric of a smooth periodic immersion, injective modulo 2πℤⁿ.
        Not a compared declaration; the closed-manifold theorem reduces to it.
    - source: "Approximation of smooth metrics by realizable ones (Wassermann, Theorem A)"
      lean: "NashEmbedding.realizable_approx_all_s"
      module: "NashEmbedding.Torus.Approximation.RealizeMetric"
      status: proved
    - source: "Günther's perturbation theorem (Wassermann, Theorem B)"
      lean: "NashEmbedding.gunther_perturbation"
      module: "NashEmbedding.Torus.Perturbation.Main"
      status: proved
    - source: "Reduction of the closed-manifold case to the torus (Wassermann, the reduction of the compact case)"
      lean: "NashEmbedding.nashCompact"
      module: "NashEmbedding.Compact.Main"
      status: proved
      note: >-
        By a Whitney embedding from Mathlib, an extension of the metric to the
        ambient Euclidean space, cutoff and periodization, and nashTorus.
    - source: "Consistency check: the flat torus 𝕊¹ × 𝕊¹"
      lean: "NashEmbedding.torus2_matches_nashTorus"
      module: "NashEmbedding.Examples.FlatTorus"
      status: proved
      note: >-
        The closed-manifold theorem applied to 𝕊¹ × 𝕊¹ with the flat metric,
        composed with the universal cover, yields exactly the conclusion of
        nashTorus for the identity metric on ℝ².

acknowledgements: >-
  Mathlib and the Lean community; Harmonic's Aristotle; A. J. Wassermann, whose
  lecture notes were the source.
