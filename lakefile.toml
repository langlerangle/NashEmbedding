name = "NashEmbedding"
defaultTargets = ["NashEmbedding", "Challenge", "Solution", "NashEmbeddingTest"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.longLine = false
weak.linter.flexible = false
weak.linter.style.refine = false
weak.linter.style.show = false
weak.linter.style.multiGoal = false
weak.linter.style.induction = false
weak.linter.unusedSimpArgs = false
weak.linter.unnecessarySimpa = false
weak.linter.unusedVariables = false
weak.linter.style.whitespace = false
weak.linter.style.setOption = false
weak.linter.style.maxHeartbeats = false
weak.linter.style.emptyLine = false
# The header linter enforces Mathlib-PR header format; this project uses a
# deliberate uniform credit-line convention (see README, Provenance record).
weak.linter.style.header = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.31.0"

[[lean_lib]]
name = "NashEmbedding"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"

[[lean_lib]]
name = "NashEmbeddingTest"
